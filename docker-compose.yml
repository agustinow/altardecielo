# Optional: local Postgres for development parity with production.
# Set DATABASE_URL=postgres://altar:altar@localhost:5432/altar_de_cielo in .env to use it.
# Without it, the app falls back to a local SQLite file (no Docker needed).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: altar
      POSTGRES_PASSWORD: altar
      POSTGRES_DB: altar_de_cielo
    ports:
      - '5432:5432'
    volumes:
      - altar-pgdata:/var/lib/postgresql/data

volumes:
  altar-pgdata:
